name: Render keepalive

on:
  schedule:
    # GitHub-hosted schedules are best effort and can be delayed.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out main branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous history
        run: |
          mkdir -p "$RUNNER_TEMP/monitor-data"
          if git ls-remote --exit-code --heads origin monitor-data >/dev/null 2>&1; then
            git fetch origin monitor-data
            if git cat-file -e origin/monitor-data:history.json 2>/dev/null; then
              git show origin/monitor-data:history.json > "$RUNNER_TEMP/monitor-data/history.json"
              echo "Restored prior health-check history."
            else
              echo "History branch exists but has no history file yet."
            fi
          else
            echo "No saved history found; starting a new history file."
          fi

      - name: Ping Render endpoint
        id: probe
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: python3 scripts/check_render.py --output-dir "$RUNNER_TEMP/monitor-data" --timeout 20 --retries 3 --retry-delay 2 --max-history 100

      - name: Publish status and history
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin monitor-data >/dev/null 2>&1; then
            git fetch origin monitor-data
            git checkout -B monitor-data origin/monitor-data
          else
            git checkout --orphan monitor-data
            git rm -rf . >/dev/null 2>&1 || true
          fi

          if [ -f "$RUNNER_TEMP/monitor-data/status.json" ] && [ -f "$RUNNER_TEMP/monitor-data/history.json" ]; then
            cp "$RUNNER_TEMP/monitor-data/status.json" ./status.json
            cp "$RUNNER_TEMP/monitor-data/history.json" ./history.json
            git add status.json history.json
            git commit -m "Record Render health check" || echo "No new status to commit."
            git push origin monitor-data
          else
            echo "Health-check output files were not created; nothing to publish."
          fi
